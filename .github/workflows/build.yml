name: Build

# Builds release binaries of the mmr CLI for Linux and macOS (x86_64 and arm64).
# Every run uploads one `mmr-<target>` artifact per target. A `v*` tag also
# attaches the archives to the GitHub release for that tag.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc floor at 2.35.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    env:
      TARGET: ${{ matrix.target }}
      # Oldest macOS the binaries run on. Linux builds ignore it.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET" --no-self-update
          rustup default stable
          rustc --version --verbose

      # Tag builds skip the cache so release binaries never build from a cache
      # that a branch or pull request run wrote.
      - name: Restore Rust cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target "$TARGET"

      - name: Smoke test
        run: |
          bin="target/$TARGET/release/mmr"
          version="$("$bin" --version)"
          echo "$version"
          "$bin" --help >/dev/null
          "$bin" skill load >/dev/null
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            expected="mmr ${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$expected" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the binary version ($version). Bump Cargo.toml or fix the tag."
              exit 1
            fi
          fi

      - name: Package
        run: |
          archive="mmr-$TARGET.tar.gz"
          staging="$RUNNER_TEMP/mmr-$TARGET"
          mkdir -p "$staging" dist
          cp "target/$TARGET/release/mmr" README.md "$staging/"
          COPYFILE_DISABLE=1 tar --no-xattrs -C "$staging" -czf "dist/$archive" mmr README.md
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" >"$archive.sha256"
          else
            shasum -a 256 "$archive" >"$archive.sha256"
          fi
          cat "$archive.sha256"
          tar -tzvf "$archive"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mmr-${{ matrix.target }}
          path: |
            dist/mmr-${{ matrix.target }}.tar.gz
            dist/mmr-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mmr-*
          path: dist
          merge-multiple: true

      - name: Verify checksums
        working-directory: dist
        run: |
          sha256sum --check mmr-*.tar.gz.sha256
          cat mmr-*.tar.gz.sha256 >SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prerelease=()
            if [[ "$TAG" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes "${prerelease[@]}"
          fi
          gh release upload "$TAG" dist/* --clobber
