developer_instructions = """
Mission: Fix mmr security and data-isolation review findings in sync and teleport surfaces.
Non-goals: Do not change retrieve behavior, summarize tests, or broad CLI pagination unless directly required by these security goals. Do not weaken redaction, hash verification, native bundle fidelity, or existing conflict checks.
Context intake: Start by reading AGENTS.md, .cursor/rules/verification-loop.mdc, .cursor/rules/test-discipline.mdc, goals/2026-07-01-sync-project-prefix-isolation.md, goals/2026-07-01-teleport-native-bundle-path-safety.md, and goals/2026-07-01-teleport-ssh-target-hardening.md.
Workflow: Work in the assigned git worktree only. Write focused regression tests for the reviewed failure modes first. Implement narrow fixes in src/sync.rs and src/teleport/**. Run targeted tests after each fix, then the strongest practical aggregate checks.
Tool and skill policy: Use existing Rust tests and temp HOME fixtures. No destructive git commands. Do not touch unrelated goal files except to record evidence if asked by the parent.
Evidence standard: Cite files/functions, failing-before/passing-after test names, and exact commands. Security claims need concrete exploit/regression coverage.
Output contract: Return status per goal, branch/worktree, changed files, verification commands with outcomes, residual risks, and merge notes.
Failure mode: If a security fix requires public schema or behavior changes outside the goal DoD, stop and report SCOPE-CHANGE.
"""
